<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace | LibroAI</title>
    <link rel="stylesheet" href="/landing.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Montserrat', sans-serif;
        }

        .m-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 120px 40px 40px; /* Offset for fixed header */
        }

        /* Hero Section for Marketplace */
        .marketplace-hero {
            text-align: center;
            padding: 60px 0 80px;
            position: relative;
        }

        .marketplace-hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 64px;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }

        .marketplace-hero p {
            color: var(--text-grey);
            font-size: 18px;
            max-width: 600px;
            margin: 0 auto;
            font-family: 'Lora', serif;
            font-style: italic;
        }

        /* Tabs Styling */
        .m-tabs {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 60px;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 15px;
        }

        .m-tab {
            cursor: pointer;
            color: var(--text-grey);
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            position: relative;
        }

        .m-tab:hover {
            color: var(--text-white);
        }

        .m-tab.active {
            color: var(--accent-ocre);
        }

        .m-tab.active::after {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--accent-ocre);
        }

        /* Grid & Cards */
        .m-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 40px;
        }

        .m-card {
            background: #141414;
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            overflow: hidden;
            transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .m-card:hover {
            transform: translateY(-10px);
            border-color: var(--accent-ocre);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .m-cover-container {
            width: 100%;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: #000;
            position: relative;
        }

        .m-cover {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.6s;
        }

        .m-card:hover .m-cover {
            transform: scale(1.05);
        }

        .m-card-body {
            padding: 25px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .m-card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-white);
        }

        .m-card-author {
            color: var(--accent-ocre);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .m-card-footer {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .m-price {
            font-weight: 700;
            color: var(--text-white);
            font-size: 18px;
        }

        .m-price span {
            font-size: 12px;
            color: var(--text-grey);
            font-weight: 400;
            margin-right: 2px;
        }

        .btn-buy-mini {
            background: var(--accent-wine);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-buy-mini:hover {
            background: #722f37;
        }

        /* Nav Correction */
        header.nav-header {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(10px);
        }

    </style>
</head>
<body>

    <!-- Header similar to Landing -->
    <header class="nav-header">
        <div class="nav-container">
            <a href="/" class="logo">LIBRO<span>AI</span></a>
            <div class="nav-right">
                <a href="/dashboard" class="nav-link">Ir a mi Escritorio</a>
                <div class="user-profile" id="userProfile" style="display: none;">
                    <img id="userAvatar" src="" alt="Profile">
                    <div class="dropdown-menu">
                        <a href="/dashboard"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                        <a href="/libroia"><i class="fa-solid fa-pen-nib"></i> Escribir</a>
                        <a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Salir</a>
                    </div>
                </div>
                <button class="btn btn-primary" id="loginBtn" onclick="openLoginModal()" style="display: none;">Entrar</button>
            </div>
        </div>
    </header>

    <div class="m-container">
        <section class="marketplace-hero">
            <h1>Exposición Literaria</h1>
            <p>Descubre obras maestras forjadas con la inteligencia del futuro y la pasión del pasado.</p>
        </section>

        <div class="m-tabs">
            <div class="m-tab active" id="tabMarket">Explorar Galería</div>
            <div class="m-tab" id="tabLibrary">Mi Biblioteca Personal</div>
        </div>

        <div id="bookGrid" class="m-grid">
            <!-- Libros se cargarán aquí -->
            <div style="grid-column: 1/-1; text-align: center; padding: 100px; color: var(--text-grey);">
                <i class="fa-solid fa-spinner fa-spin fa-2xl"></i>
                <p style="margin-top: 20px;">Curando la colección...</p>
            </div>
        </div>
    </div>

    <script src="/libroia/marketplace.js"></script>
    <script>
        // Minimal session check for the header
        async function checkNavSession() {
            try {
                const r = await fetch("/api/auth/me");
                const data = await r.json();
                const profile = document.getElementById('userProfile');
                const loginBtn = document.getElementById('loginBtn');
                
                if (data.user) {
                    profile.style.display = 'flex';
                    loginBtn.style.display = 'none';
                    document.getElementById('userAvatar').src = data.user.avatar_url || `https://ui-avatars.com/api/?name=${data.user.email}&background=641220&color=fff`;
                } else {
                    profile.style.display = 'none';
                    loginBtn.style.display = 'block';
                }
            } catch (e) {
                console.error("Session check failed", e);
            }
        }
        checkNavSession();

        async function logout() {
            await fetch("/api/auth/logout", { method: "POST" });
            window.location.href = "/";
        }
    </script>
</body>
</html>
