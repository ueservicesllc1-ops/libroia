<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Vendedor | LibroAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #141414;
            --panel-soft: #1a1a1a;
            --text: #f8fafc;
            --muted: #94a3b8;
            --wine: #5b1c23;
            --wine-hover: #722f37;
            --ocre: #967117;
            --ocre-bright: #c9980a;
            --border: rgba(255,255,255,0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--text);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 0%, rgba(91, 28, 35, 0.25), transparent 35%),
                        radial-gradient(circle at 85% 10%, rgba(150, 113, 23, 0.18), transparent 35%),
                        var(--bg);
        }
        .sidebar {
            width: 260px;
            background: rgba(20, 20, 20, 0.92);
            border-right: 1px solid var(--border);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            padding: 28px 18px;
        }
        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.6px;
            margin: 2px 10px 30px;
        }
        .brand span { color: var(--ocre); }
        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 14px;
            color: var(--muted);
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 8px;
            transition: all 0.25s ease;
            font-size: 14px;
            border: 1px solid transparent;
        }
        .nav-link.active {
            background: rgba(91, 28, 35, 0.35);
            border-color: rgba(150, 113, 23, 0.45);
            color: #fff;
        }
        .nav-link:hover {
            color: #fff;
            border-color: rgba(150, 113, 23, 0.25);
            background: rgba(255,255,255,0.03);
        }
        .main-content { flex: 1; padding: 32px; overflow-y: auto; }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .title-wrap h1 {
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #fff;
        }
        .title-wrap p {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 13px;
        }
        .toolbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .btn {
            border: 0;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-wine {
            background: var(--wine);
            color: #fff;
        }
        .btn-wine:hover { background: var(--wine-hover); transform: translateY(-1px); }
        .btn-ocre {
            background: linear-gradient(135deg, var(--ocre), var(--ocre-bright));
            color: #111;
        }
        .btn-ocre:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(150, 113, 23, 0.35); }
        .payout-btn:disabled { background: #374151; cursor: not-allowed; transform: none; box-shadow: none; }
        .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .card {
            background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.015));
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }
        .card h3 { margin: 0; font-size: 18px; }
        .card-val { font-size: 28px; font-weight: 800; margin: 8px 0 0; color: #fff; }
        .card-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; }
        table { width: 100%; border-collapse: collapse; margin-top: 14px; }
        th { text-align: left; padding: 14px 10px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
        td { padding: 14px 10px; border-top: 1px solid rgba(255,255,255,0.05); }
        .empty-row { color: var(--muted); font-style: italic; }
        @media (max-width: 1100px) {
            .stats-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 860px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
            .main-content { padding: 20px; }
            .toolbar { flex-direction: column; align-items: flex-start; }
            .stats-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="fa-solid fa-store"></i> LIBRO<span>AI</span></div>
        <nav>
            <a href="#" class="nav-link active"><i class="fa-solid fa-chart-line"></i> Resumen</a>
            <a href="/dashboard" class="nav-link"><i class="fa-solid fa-pen-nib"></i> Editor</a>
            <a href="/library" class="nav-link"><i class="fa-solid fa-book"></i> Biblioteca</a>
        </nav>
    </div>

    <div class="main-content">
        <header class="toolbar">
            <div class="title-wrap">
                <h1>Mis Finanzas</h1>
                <p>Panel de ventas y cobros con estilo premium LibroAI.</p>
            </div>
            <div class="toolbar-actions">
                <a href="/libroia" class="btn btn-wine"><i class="fa-solid fa-feather-pointed"></i> Escribir libro</a>
                <a href="/dashboard" class="btn btn-wine"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
                <button id="requestPayoutBtn" class="btn btn-ocre payout-btn"><i class="fa-solid fa-money-bill-transfer"></i> Solicitar Pago</button>
            </div>
        </header>

        <div class="stats-row">
            <div class="card">
                <div class="card-label">Balance Disponible</div>
                <div id="availBalance" class="card-val">$0.00</div>
            </div>
            <div class="card">
                <div class="card-label">Ingreso Total (Neto)</div>
                <div id="netEarnings" class="card-val">$0.00</div>
            </div>
            <div class="card">
                <div class="card-label">Libros Publicados</div>
                <div id="booksCount" class="card-val">0</div>
            </div>
            <div class="card">
                <div class="card-label">Ventas Totales</div>
                <div id="salesCount" class="card-val">0</div>
            </div>
        </div>

        <div class="card">
            <h3>Tus Libros</h3>
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Precio</th>
                        <th>Ventas</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="booksTable"></tbody>
            </table>
        </div>

        <div class="card" style="margin-top: 30px;">
            <h3>Historial de Pagos</h3>
            <table id="payoutsTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Monto</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadDashboard() {
            const r = await fetch("/api/seller/dashboard");
            const data = await r.json();
            if (data.error) {
                alert(data.error);
                window.location.href = "/vender";
                return;
            }

            document.getElementById("availBalance").textContent = `$${(data.balance.available_balance / 100).toFixed(2)}`;
            document.getElementById("netEarnings").textContent = `$${(data.balance.lifetime_earnings / 100).toFixed(2)}`;
            document.getElementById("booksCount").textContent = data.books.length;
            document.getElementById("salesCount").textContent = data.stats.total_sales;

            const bTable = document.getElementById("booksTable");
            bTable.innerHTML = data.books.map(b => `
                <tr>
                    <td><strong>${b.title}</strong></td>
                    <td>$${(b.price / 100).toFixed(2)}</td>
                    <td>${b.sales_count}</td>
                    <td>${b.is_published ? "Publicado" : "Borrador"}</td>
                </tr>
            `).join("");
            if (!data.books.length) {
                bTable.innerHTML = `<tr><td class="empty-row" colspan="4">Aún no tienes libros publicados para mostrar aquí.</td></tr>`;
            }

            const pTable = document.getElementById("payoutsTable").querySelector("tbody");
            pTable.innerHTML = data.payouts.map(p => `
                <tr>
                    <td>${new Date(p.created_at).toLocaleDateString()}</td>
                    <td>$${(p.amount / 100).toFixed(2)}</td>
                    <td><span style="color: ${p.status === 'paid' ? '#10b981' : '#f59e0b'}">${p.status.toUpperCase()}</span></td>
                </tr>
            `).join("");
            if (!data.payouts.length) {
                pTable.innerHTML = `<tr><td class="empty-row" colspan="3">Todavía no hay pagos solicitados.</td></tr>`;
            }

            const payoutBtn = document.getElementById("requestPayoutBtn");
            payoutBtn.disabled = data.balance.available_balance < 1000; // Min $10
            payoutBtn.onclick = async () => {
                const amount = data.balance.available_balance;
                if (!confirm(`¿Solicitar pago de $${(amount/100).toFixed(2)}?`)) return;
                const res = await fetch("/api/seller/request-payout", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ amount })
                });
                const dr = await res.json();
                if (dr.success) {
                    alert(dr.message);
                    loadDashboard();
                } else {
                    alert(dr.error);
                }
            };
        }
        loadDashboard();
    </script>
</body>
</html>
