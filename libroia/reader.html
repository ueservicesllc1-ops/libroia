<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector | LibroAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-dark: #0f172a;
            --bg-page: #f8f1e7;
            --text-main: #1e293b;
            --accent: #8b6914;
            --border: rgba(226, 232, 240, 0.1);
        }

        body {
            background: var(--bg-dark);
            color: #f1f5f9;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top Bar ─────────────────────────────────────── */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 200;
        }
        .top-bar a { color: #94a3b8; text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .top-bar a:hover { color: #f1f5f9; }
        .top-bar .book-nav-title { font-weight: 600; color: #f1f5f9; }
        .top-bar .page-indicator { color: #64748b; font-size: 12px; }

        /* ── Reader Stage ────────────────────────────────── */
        .reader-stage {
            flex: 1;
            display: flex;
            justify-content: center;
            overflow-y: auto;
            padding: 40px 20px;
            scroll-behavior: smooth;
        }

        .book-content-wrapper {
            width: min(800px, 100%);
            background: var(--bg-page);
            color: var(--text-main);
            padding: 80px 60px;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            min-height: 100%;
        }

        .page-text {
            font-family: 'Lora', Georgia, serif;
            font-size: 18px;
            line-height: 1.8;
            text-align: justify;
        }

        .page-text h1, .page-text h2 {
            font-family: 'Playfair Display', serif;
            text-align: center;
            margin: 40px 0 20px;
            color: #0f172a;
        }

        .page-text p {
            margin-bottom: 1.5em;
        }

        /* ── Navigation ──────────────────────────────────── */
        .reader-nav {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 8px 12px;
            border-radius: 99px;
            border: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .btn-nav {
            background: transparent;
            border: none;
            color: #94a3b8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-nav:hover:not(:disabled) { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 12px;
            border-left: 1px solid rgba(255,255,255,0.1);
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .progress-bar {
            width: 120px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            position: relative;
        }
        .progress-fill {
            position: absolute;
            left: 0; top: 0; height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 0.3s;
        }

        /* ── Loading ─────────────────────────────────────── */
        .loading-overlay {
            position: fixed; inset: 0; background: var(--bg-dark);
            display: grid; place-items: center; z-index: 1000;
            transition: opacity 0.5s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .loading-spinner {
            width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: var(--accent); border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 600px) {
            /* Single page mode on mobile */
            :root { --page-w: min(90vw, 360px); --page-h: calc(var(--page-w) * 1.4); }
            .book-container { width: var(--page-w); }
            .page-left { display: none; }
            .page-right { left: 0; border-radius: 2px; }
            .page-right .page-number { text-align: center; left: 0; right: 0; }
            .book-cover-bg { border-radius: 8px; }
            .flip-page { left: 0; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Abriendo libro…</div>
    </div>

    <header class="top-bar">
        <a href="/libroia/marketplace.html" id="backLink"><i class="fa-solid fa-arrow-left"></i> Volver a la Biblioteca</a>
        <span class="book-nav-title" id="bookNavTitle">LibroAI Reader</span>
        <span class="page-indicator" id="pageIndicator"></span>
    </header>

    <main class="reader-stage" id="readerStage">
        <div class="book-content-wrapper">
            <div id="bookContent" class="page-text">
                <!-- El contenido del libro se cargará aquí -->
            </div>
        </div>
    </main>

    <nav class="reader-nav">
        <button class="btn-nav" id="btnPrev" title="Anterior"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="page-count" id="pageCount">0%</span>
        </div>
        <button class="btn-nav" id="btnNext" title="Siguiente"><i class="fa-solid fa-chevron-right"></i></button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <script src="./reader.js"></script>
</body>
</html>
