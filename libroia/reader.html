<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector | LibroAI</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
        :root {
            --r-bg: #fdfdfd;
            --r-text: #1a1a1a;
            --r-accent: #6366f1;
        }
        body {
            background: var(--r-bg);
            color: var(--r-text);
            margin: 0;
            padding: 0;
            font-family: 'Lora', Georgia, serif;
            line-height: 1.8;
        }
        .r-header {
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #eee;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .r-content {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .r-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 40px;
            text-align: center;
        }
        .r-chapter-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-top: 60px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--r-accent);
            display: inline-block;
        }
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: var(--r-accent);
            width: 0%;
            transition: width 0.1s;
            z-index: 101;
        }
    </style>
</head>
<body>
    <div class="progress-bar" id="progressBar"></div>
    <header class="r-header">
        <a href="/marketplace.html" style="text-decoration: none; color: var(--r-accent); font-weight: 600;">← Volver</a>
        <div id="bookTitleNav" style="font-weight: 700; font-family: 'Plus Jakarta Sans';">LibroAI Reader</div>
        <div id="progressText" style="font-size: 12px; color: #666;">0% leído</div>
    </header>

    <main class="r-content" id="readerBody">
        <h1 class="r-title" id="bookMainTitle">Cargando...</h1>
        <div id="bookChapters"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
    <script src="./reader.js"></script>
</body>
</html>
